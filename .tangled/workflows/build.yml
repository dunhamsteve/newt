when:
  - event: ["push", "manual"]
    branch: ["main"]
engine: "nixery"
dependencies:
  nixpkgs:
    - nodejs
    - gnumake
    - diffutils
    - findutils
    - git
    - time
steps:
  - name: "build newt"
    command: "make newt3"
  - name: "build lsp"
    command: |
      (cd newt-vscode-lsp && npm i)
      make lsp
  - name: "test"
    command: "make test"
